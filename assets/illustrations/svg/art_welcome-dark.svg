e(1.8); } } .hs4 .fs { animation: hs4fs 9s cubic-bezier(.5,0,.3,1) infinite; filter: drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 1.2px #fff); } .hs4 .bub { animation: hs4bub 9s cubic-bezier(.3,1.3,.5,1) infinite; transform-origin: 20% 100%; } .hs4 .typed { animation: hs4type 9s steps(17, end) infinite; transform-origin: 0 50%; } .hs4 .caret { animation: hs4caret 9s steps(17, end) infinite; } .hs4 .typo { animation: hs4typo 9s infinite; } .hs4 .old { animation: hs4old 9s infinite; } .hs4 .new { animation: hs4new 9s infinite; } .hs4 .face { animation: hs4face 9s infinite; } .hs4 .open { animation: hs4open 9s cubic-bezier(.3,1.4,.5,1) infinite; } .hs4 .happy { animation: hs4happy 9s infinite; opacity: 0; } .hs4 .look { animation: hs4look 9s ease-in-out infinite; } .hs4 .brows { animation: hs4brows 9s infinite; opacity: 0; } .hs4 .bl { animation: hs4bl 9s infinite; } .hs4 .br { animation: hs4br 9s infinite; } .hs4 .smile { animation: hs4smile 9s infinite; } .hs4 .grin { animation: hs4grin 9s infinite; opacity: 0; } .hs4 .oh { animation: hs4oh 9s infinite; opacity: 0; } .hs4 .body { animation: hs4body 9s cubic-bezier(.4,0,.2,1) infinite; transform-origin: 50% 100%; } .hs4 .sp { animation: hs4sp 9s cubic-bezier(.3,1.4,.5,1) infinite; } .hs4 .fly { offset-path: path('M90 93 C 96 70, 104 70, 112 62'); offset-rotate: 0deg; animation: hs4fly 9s cubic-bezier(.4,0,.2,1) infinite; } .hs4 .burst { animation: hs4burst 9s infinite; } @media (prefers-reduced-motion: reduce) { .hs4 * { animation-play-state: paused !important; animation-delay: -7.3s !important; } }</style><defs><linearGradient id="hs4g" x1="20" y1="20" x2="200" y2="200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1E9BD7" stop-opacity="1"/><stop offset="0.5" stop-color="#22C3CF" stop-opacity="1"/><stop offset="1" stop-color="#4BDCA4" stop-opacity="1"/></linearGradient><radialGradient id="hs4gf" cx="110" cy="110" r="90" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".5"/><stop offs