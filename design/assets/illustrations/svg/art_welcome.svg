<svg xmlns="http://www.w3.org/2000/svg" class="hs1" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="The S from the logo becomes the first letter of a message; the key watches, spots a typo and fixes it"><style>@import url("https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&amp;display=swap");</style><style>.hs1 [class] { transform-box: fill-box; transform-origin: center; } @keyframes hs1fs { 0%,9% { transform: none; opacity: 1; } 19% { transform: translate(-2.8px,-96.6px) scale(0.212); opacity: 1; } 20%,92% { transform: translate(-2.8px,-96.6px) scale(0.212); opacity: 0; } 93% { opacity: 1; } 100% { transform: none; opacity: 1; } } @keyframes hs1bub { 0%,6% { transform: scale(.3); opacity: 0; } 12%,88% { transform: scale(1); opacity: 1; } 94%,100% { transform: scale(.6); opacity: 0; } } @keyframes hs1type { 0%,19.4% { transform: scaleX(0); } 19.5% { transform: scaleX(0.056); } 56%,100% { transform: scaleX(1); } } @keyframes hs1caret { 0% { transform: translateX(-6.2px); opacity: 1; } 4% { opacity: 0; } 8% { opacity: 1; } 12% { opacity: 0; } 16%,19.4% { transform: translateX(-6.2px); opacity: 1; } 19.5% { transform: translateX(0); opacity: 1; } 56% { transform: translateX(105.8px); opacity: 1; } 57%,100% { opacity: 0; } } @keyframes hs1typo { 0%,57% { opacity: 0; } 59%,74% { opacity: 1; } 75%,100% { opacity: 0; } } @keyframes hs1old { 0%,74% { opacity: 1; } 76%,100% { opacity: 0; } } @keyframes hs1new { 0%,75% { opacity: 0; } 78%,88% { opacity: 1; } 94%,100% { opacity: 0; } } @keyframes hs1face { 0%,17% { opacity: 0; } 20%,88% { opacity: 1; } 93%,100% { opacity: 0; } } @keyframes hs1open { 0%,19% { transform: scaleY(.05); opacity: 1; } 24% { transform: scaleY(1); } 56% { transform: scale(1); } 59% { transform: scale(1.3); } 63% { transform: scale(1.25); } 66%,73% { transform: scaleY(.45); } 76% { transform: scaleY(1); opacity: 1; } 77%,100% { opacity: 0; } } @keyframes hs1happy { 0%,76% { opacity: 0; } 78%,90% { opacity: 1; } 92%,100% { opacity: 0; } } @keyframes hs1look { 0%,22% { transform: translate(-2px,-3px); } 56% { transform: translate(4px,-3px); } 59%,74% { transform: translate(3px,-4px); } 78%,100% { transform: none; } } @keyframes hs1brows { 0%,57% { opacity: 0; transform: none; } 59%,63% { opacity: 1; transform: translateY(-3px); } 66%,74% { opacity: 1; transform: translateY(1px); } 77%,100% { opacity: 0; } } @keyframes hs1bl { 0%,64% { transform: none; } 66%,74% { transform: rotate(14deg); } 77%,100% { transform: none; } } @keyframes hs1br { 0%,64% { transform: none; } 66%,74% { transform: rotate(-14deg); } 77%,100% { transform: none; } } @keyframes hs1smile { 0%,57% { opacity: 1; } 59%,90% { opacity: 0; } 94%,100% { opacity: 1; } } @keyframes hs1grin { 0%,75% { opacity: 0; } 77%,90% { opacity: 1; } 94%,100% { opacity: 0; } } @keyframes hs1oh { 0%,57% { opacity: 0; } 59%,64% { opacity: 1; } 66%,100% { opacity: 0; } } @keyframes hs1body { 0%,5%,11%,57%,100% { transform: none; } 8% { transform: translateY(3px) scale(1.02,.92); } 60%,64% { transform: rotate(-6deg) translateY(-2px); } 67% { transform: translateY(3px) scale(1.05,.93); } 71% { transform: translateY(-6px) rotate(3deg); } 75% { transform: none; } 80% { transform: translateY(2px) scale(1.05,.94); } 84% { transform: translateY(-12px); } 88% { transform: none; } } @keyframes hs1sp { 0%,17% { transform: none; opacity: 1; } 24%,66% { transform: translate(14px,-30px) scale(1.2); opacity: 1; } 67%,92% { opacity: 0; transform: translate(14px,-30px); } 96%,100% { transform: none; opacity: 1; } } @keyframes hs1fly { 0%,66% { offset-distance: 0%; opacity: 0; } 67% { opacity: 1; } 74% { offset-distance: 100%; opacity: 1; transform: scale(1.3) rotate(90deg); } 76%,100% { offset-distance: 100%; opacity: 0; } } @keyframes hs1burst { 0%,73% { opacity: 0; transform: scale(.3); } 76% { opacity: .9; transform: scale(1); } 84%,100% { opacity: 0; transform: scale(1.8); } } .hs1 .fs { animation: hs1fs 9s cubic-bezier(.5,0,.3,1) infinite; filter: drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 1.2px #fff); } .hs1 .bub { animation: hs1bub 9s cubic-bezier(.3,1.3,.5,1) infinite; transform-origin: 20% 100%; } .hs1 .typed { animation: hs1type 9s steps(17, end) infinite; transform-origin: 0 50%; } .hs1 .caret { animation: hs1caret 9s steps(17, end) infinite; } .hs1 .typo { animation: hs1typo 9s infinite; } .hs1 .old { animation: hs1old 9s infinite; } .hs1 .new { animation: hs1new 9s infinite; } .hs1 .face { animation: hs1face 9s infinite; } .hs1 .open { animation: hs1open 9s cubic-bezier(.3,1.4,.5,1) infinite; } .hs1 .happy { animation: hs1happy 9s infinite; opacity: 0; } .hs1 .look { animation: hs1look 9s ease-in-out infinite; } .hs1 .brows { animation: hs1brows 9s infinite; opacity: 0; } .hs1 .bl { animation: hs1bl 9s infinite; } .hs1 .br { animation: hs1br 9s infinite; } .hs1 .smile { animation: hs1smile 9s infinite; } .hs1 .grin { animation: hs1grin 9s infinite; opacity: 0; } .hs1 .oh { animation: hs1oh 9s infinite; opacity: 0; } .hs1 .body { animation: hs1body 9s cubic-bezier(.4,0,.2,1) infinite; transform-origin: 50% 100%; } .hs1 .sp { animation: hs1sp 9s cubic-bezier(.3,1.4,.5,1) infinite; } .hs1 .fly { offset-path: path('M90 93 C 96 70, 104 70, 112 62'); offset-rotate: 0deg; animation: hs1fly 9s cubic-bezier(.4,0,.2,1) infinite; } .hs1 .burst { animation: hs1burst 9s infinite; } @media (prefers-reduced-motion: reduce) { .hs1 * { animation-play-state: paused !important; animation-delay: -7.3s !important; } }</style><defs><linearGradient id="hs1g" x1="20" y1="20" x2="200" y2="200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1E9BD7" stop-opacity="1"/><stop offset="0.5" stop-color="#22C3CF" stop-opacity="1"/><stop offset="1" stop-color="#4BDCA4" stop-opacity="1"/></linearGradient><radialGradient id="hs1gf" cx="110" cy="110" r="90" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".5"/><stop offset=".75" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-