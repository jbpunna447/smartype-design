<!-- @dsCard group="Containment" height=440 subtitle="Bottom sheet for choices, dialog for confirmations" -->
<div class="st-demo">
  <div class="st-cols">
    <div>
      <p class="lab">Bottom sheet · choose or edit</p>
      <div class="st-scrim">
        <div class="st-sheet">
          <div class="handle"></div>
          <h4 style="font-size:22px;line-height:28px;font-weight:600">Hindi (India)</h4>
          <div class="st-group" style="background:var(--surface-container-high)">
            <div class="st-row"><div class="txt"><div class="t">Transliteration on QWERTY</div><div class="s">Type "namaste", get नमस्ते</div></div><span style="color:var(--primary)">●</span></div>
            <div class="st-row"><div class="txt"><div class="t">Devanagari</div><div class="s">हिंदी keyboard</div></div><span class="trail">○</span></div>
          </div>
          <button class="st-btn st-tonal full">Set as default</button>
        </div>
      </div>
    </div>
    <div>
      <p class="lab">Dialog · confirm</p>
      <div class="st-dialog">
        <h4>Remove Hindi (India)?</h4>
        <p>You can add it again anytime from Keyboard languages.</p>
        <div class="acts"><button class="st-btn st-text">Cancel</button><button class="st-btn st-danger-text">Remove</button></div>
      </div>
      <p class="lab" style="margin-top:20px">Snackbar · after an action</p>
      <div class="st-snack">Language removed<b>Undo</b></div>
    </div>
  </div>
</div>
