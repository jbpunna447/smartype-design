<!-- @dsCard height=288 -->
<style>
  html,body{margin:0;background:var(--background)}
  .cover{position:relative;width:960px;height:288px;background:var(--background);overflow:hidden;font-family:var(--font-sans)}
  .cover svg{position:absolute;left:480px;top:0}
  .teal{fill:var(--primary)}
  .deep{fill:var(--primary-container)}
  .mint{fill:var(--secondary)}
  .key{fill:var(--surface-container-highest)}
  .keylow{fill:var(--surface-container-high)}
  .rxs{rx:var(--radius-xs)}
  .rsm{rx:var(--radius-sm)}
  .rlg{rx:var(--radius-lg)}
  .rxl{rx:var(--radius-xl)}
  .name{position:absolute;left:40px;bottom:66px;margin:0;font-size:88px;line-height:.92;font-weight:700;letter-spacing:-1.5px;color:var(--on-background);max-width:440px}
  .tag{position:absolute;left:44px;bottom:36px;margin:0;font-size:14px;color:var(--on-surface-variant);max-width:440px}
</style>
<div class="cover">
  <svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
    <!--
      blocks: primary slab 160x312 (bleeds off the top, radius-xl) · primary-container 216x120 (radius-lg) · secondary 96x56 (radius-sm)
      arrangement: one tall teal slab with satellites, keyboard rows stepping off to the right edge
      pattern: geometric, modular, dense UI -> key tiles cut by radius-xs, a merged space bar; chosen because the product is a keyboard
      steps and radii: 48px keys on an 8px gap (space-2), rows on a 56px pitch; radius-xs, radius-sm, radius-lg, radius-xl
    -->
    <rect class="teal rxl" x="24" y="-24" width="160" height="312"/>
    <rect class="deep rlg" x="200" y="24" width="216" height="120"/>
    <rect class="mint rsm" x="200" y="160" width="96" height="56"/>
    <g>
      <rect class="key rxs" x="312" y="160" width="48" height="48"/>
      <rect class="key rxs" x="368" y="160" width="48" height="48"/>
      <rect class="keylow rxs" x="424" y="160" width="48" height="48"/>
      <rect class="key rxs" x="480" y="160" width="48" height="48"/>
      <rect class="keylow rxs" x="200" y="224" width="48" height="48"/>
      <rect class="key rxs" x="256" y="224" width="160" height="48"/>
      <rect class="keylow rxs" x="424" y="224" width="48" height="48"/>
      <rect class="key rxs" x="432" y="24" width="48" height="48"/>
      <rect class="keylow rxs" x="432" y="80" width="48" height="48"/>
    </g>
  </svg>
  <h1 class="name">SmarType</h1>
  <p class="tag">A calm keyboard, with AI when you ask.</p>
</div>
