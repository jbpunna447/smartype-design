<!-- @dsCard group="Selection" height=300 subtitle="Filter chips, AI style chips and badges" -->
<div class="st-demo">
  <div>
    <p class="lab">Filter chip · pick one or many</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="st-chip selected">{{icon:check}}All</button><button class="st-chip">Light</button><button class="st-chip">Dark</button><button class="st-chip">Photo</button><button class="st-chip disabled">Premium</button>
    </div>
  </div>
  <div>
    <p class="lab">AI style chip · in the AI panel</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="st-chip ai selected">Professional</button><button class="st-chip">Polite</button><button class="st-chip">Casual</button><button class="st-chip">Fix grammar</button>
    </div>
  </div>
  <div>
    <p class="lab">Badge · status, not tappable</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <span class="st-badge success">{{icon:check}}Keyboard ready</span><span class="st-badge neutral">Free plan</span><span class="st-badge info">Step 2 of 3</span><span class="st-badge error">Offline</span>
    </div>
  </div>
</div>
