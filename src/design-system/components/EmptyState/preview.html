<!-- @dsCard group="Feedback" height=420 subtitle="With the illustration set" -->
<style>
  .es{width:320px;box-sizing:border-box;background:var(--background);border:1px solid var(--outline-variant);border-radius:24px;padding:40px 24px 32px;display:grid;justify-items:center;text-align:center;gap:0}
  .es .art{width:160px;height:160px}.es .art svg{display:block}
  .es h4{margin:16px 0 0;font-size:24px;line-height:32px;font-weight:500;color:var(--on-surface)}
  .es p{margin:8px 0 20px;font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--on-surface-variant);max-width:240px}
</style>
<div class="st-demo">
  <div class="st-cols">
    <div class="es">
      <div class="art" aria-hidden="true">{{art:art_empty_notes}}</div>
      <h4>No notes yet</h4>
      <p>Notes you write on the keyboard show up here.</p>
      <button class="st-btn st-tonal">New note</button>
    </div>
    <div class="es">
      <div class="art" aria-hidden="true">{{art:art_empty_search}}</div>
      <h4>No languages found</h4>
      <p>Nothing matches “klingon”. Try another spelling, or the language’s own name.</p>
    </div>
  </div>
</div>
