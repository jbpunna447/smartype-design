<!-- @dsCard group="Feedback" height=420 subtitle="Layout shown with a stand-in for the 3D art" -->
<style>
  .es{width:320px;box-sizing:border-box;background:var(--background);border:1px solid var(--outline-variant);border-radius:24px;padding:40px 24px 32px;display:grid;justify-items:center;text-align:center;gap:0}
  .es .art{width:160px;height:160px;border-radius:var(--radius-xl);background:radial-gradient(circle at 50% 45%,var(--surface-container-high),var(--background) 70%);display:grid;place-items:center;position:relative}
  .es .key{width:62px;height:58px;border-radius:14px;background:var(--surface-container-highest);box-shadow:inset 0 -6px 0 var(--surface-container-low),0 10px 18px rgba(0,0,0,.25)}
  .es .sheet{position:absolute;width:44px;height:58px;border-radius:6px;background:color-mix(in srgb,var(--on-surface) 14%,transparent);border:1px solid color-mix(in srgb,var(--primary) 60%,transparent);transform:rotate(-10deg) translate(-38px,-6px)}
  .es h4{margin:16px 0 0;font-size:24px;line-height:32px;font-weight:500;color:var(--on-surface)}
  .es p{margin:8px 0 20px;font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--on-surface-variant);max-width:240px}
</style>
<div class="st-demo">
  <div class="st-cols">
    <div class="es">
      <div class="art" aria-hidden="true"><i class="sheet"></i><i class="key"></i></div>
      <h4>No saved notes yet</h4>
      <p>Write something in a draft and save it to keep it here.</p>
      <button class="st-btn st-tonal">New draft</button>
    </div>
  </div>
</div>
