<div class="st-demo">
  <div class="st-cols">
    <div style="width:320px;display:grid;gap:12px">
      <p class="lab">Card</p>
      <div class="st-card"><h4>Writing styles</h4><p>4 pinned · 23 available</p></div>
      <div class="st-card hero">
        <div style="display:flex;justify-content:space-between;align-items:center"><h4>Premium</h4><span class="st-badge success">Active</span></div>
        <p>Unlimited rewrites and translations. Renews 12 Nov.</p>
        <div><button class="st-btn st-tonal size-s">Manage in Google Play</button></div>
      </div>
    </div>
    <div style="width:320px;display:grid;gap:12px">
      <p class="lab">Banner</p>
      <div class="st-banner info"><span class="ic">ⓘ</span><div><b>Sign in to use AI</b>Typing works without an account.</div><span class="act">Sign in</span></div>
      <div class="st-banner success"><span class="ic">✓</span><div><b>SmarType is on</b>Now make it your keyboard.</div></div>
      <div class="st-banner error"><span class="ic">!</span><div><b>AI can't run on this device right now</b>Your text wasn't sent.</div><span class="act">Try again</span></div>
    </div>
  </div>
</div>
