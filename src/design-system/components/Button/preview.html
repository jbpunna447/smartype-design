<!-- @dsCard group="Actions" height=520 subtitle="Static rendition of the proposed SmarTypeButton" -->
<style>
  body{margin:0;background:var(--background);color:var(--on-surface);font-family:var(--font-sans)}
  .wrap{padding:20px;display:grid;gap:22px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .lab{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.1px;color:var(--on-surface-variant);margin:0 0 8px;text-transform:uppercase}
  .phone{width:320px;border-radius:24px;background:var(--surface-container-low);padding:16px;display:grid;gap:8px}
  .phone p{margin:0 0 8px;font-size:14px;line-height:20px;color:var(--on-surface-variant)}
  .pair{display:flex;justify-content:flex-end;gap:8px}
</style>
<div class="wrap">
  <div>
    <p class="lab">Variants · medium 48 dp</p>
    <div class="row">
      <button class="st-btn st-filled">Turn on SmarType</button>
      <button class="st-btn st-ai">✦ Rewrite</button>
      <button class="st-btn st-tonal">Copy</button>
      <button class="st-btn st-outlined">Choose layout</button>
      <button class="st-btn st-text">Not now</button>
      <button class="st-btn st-danger">Remove</button>
    </div>
  </div>
  <div>
    <p class="lab">States · filled</p>
    <div class="row">
      <button class="st-btn st-filled">Enabled</button>
      <button class="st-btn st-filled is-pressed">Pressed</button>
      <button class="st-btn st-filled is-focus">Focused</button>
      <button class="st-btn st-filled" disabled>Disabled</button>
      <button class="st-btn st-filled" aria-busy="true"><span class="spin"></span>Saving</button>
    </div>
  </div>
  <div>
    <p class="lab">Sizes</p>
    <div class="row">
      <button class="st-btn st-filled size-l">Large 56</button>
      <button class="st-btn st-filled">Medium 48</button>
      <button class="st-btn st-tonal size-s">Small 40</button>
      <button class="st-icon" aria-label="Settings">⚙</button>
      <button class="st-icon tonal" aria-label="Search">⌕</button>
    </div>
  </div>
  <div class="row" style="align-items:flex-start;gap:20px">
    <div class="phone">
      <p class="lab">Bottom of a task screen</p>
      <p>One large filled button, full width. A text button under it for the way out.</p>
      <button class="st-btn st-filled size-l full">Open keyboard settings</button>
      <button class="st-btn st-text full">Skip for now</button>
    </div>
    <div class="phone">
      <p class="lab">Dialog</p>
      <p>Remove Hindi (India) from your keyboard languages?</p>
      <div class="pair"><button class="st-btn st-text">Cancel</button><button class="st-btn st-danger-text">Remove</button></div>
    </div>
  </div>
</div>
